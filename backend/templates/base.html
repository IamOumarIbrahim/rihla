<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ company }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('home') }}">{{ company }}</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'active' if active == 'home' }}">Home</a>
      <a href="{{ url_for('experiences') }}" class="{{ 'active' if active == 'experiences' }}">Experiences</a>
      <a href="{{ url_for('book') }}" class="{{ 'active' if active == 'book' }}">Book now</a>
      <a href="{{ url_for('contact') }}" class="{{ 'active' if active == 'contact' }}">Contact us</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    &copy; 2026 {{ company }}. All rights reserved.
    {% if session.get('admin') %}
      <a class="footer-link" href="{{ url_for('admin_bookings') }}">Bookings (admin)</a>
      <form method="post" action="{{ url_for('admin_logout') }}" class="inline-form">
        <button type="submit" class="link-button">Log out</button>
      </form>
    {% else %}
      <a class="footer-link" href="{{ url_for('admin_login') }}">Admin login</a>
    {% endif %}
  </footer>
</body>
</html>

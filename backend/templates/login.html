{% extends "base.html" %}
{% block title %}Log in | {{ company }}{% endblock %}
{% block content %}
<h1>Log in</h1>

{% if next_url %}
<p class="notice">Please log in to continue.</p>
{% endif %}
{% if error %}
<p class="notice error">{{ error }}</p>
{% endif %}

<form method="post" class="form">
  <input type="hidden" name="next" value="{{ next_url or '' }}" />
  <label>Email
    <input type="email" name="email" required autofocus />
  </label>
  <label>Password
    <input type="password" name="password" required />
  </label>
  <button class="btn" type="submit">Log in</button>
</form>

<p class="hint">New here? <a href="{{ url_for('customer_register', next=next_url) }}">Create an account</a></p>
{% endblock %}

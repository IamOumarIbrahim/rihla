{% extends "base.html" %}
{% block title %}Book now | {{ company }}{% endblock %}
{% block content %}
<h1>Book now</h1>

{% if message %}
<p class="notice">{{ message }}</p>
{% endif %}
{% if error %}
<p class="notice error">{{ error }}</p>
{% endif %}

<form method="post" class="form">
  <label>Full name
    <input type="text" name="name" required />
  </label>
  <label>Email
    <input type="email" name="email" required />
  </label>
  <label>Experience
    <select name="experience">
      {% for e in experiences %}
      <option value="{{ e.name }}" {% if e.remaining == 0 %}disabled{% endif %}>
        {{ e.name }} ({% if e.remaining == 0 %}sold out{% else %}{{ e.remaining }} spots left{% endif %})
      </option>
      {% endfor %}
    </select>
  </label>
  <label>Date
    <input type="date" name="date" required />
  </label>
  <label>Guests
    <input type="number" name="guests" min="1" value="1" required />
  </label>
  <button class="btn" type="submit">Send booking request</button>
</form>
{% endblock %}
